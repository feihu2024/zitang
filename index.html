<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no" />
  <title>植萃生活</title>
  <script>
    var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') || CSS.supports('top: constant(a)'))
    document.write('<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no' + (coverSupport ? ',viewport-fit=cover' : '') + '" />')
  </script>
  <style>
    /* 桌面端手机框架预览：固定 rpx 基准为 375px 屏宽，整体呈现手机外壳效果 */
    @media (min-width: 768px) {
      html {
        font-size: 16px !important;
      }
      body {
        background: #202124 !important;
        min-height: 100vh;
        overflow: hidden;
      }
      /* 手机外壳：圆角 + 深色边框 + 投影，高度固定为视口，内容在壳内滚动 */
      #app {
        width: 375px;
        max-width: 375px !important;
        height: calc(100vh - 24px) !important;
        min-height: 0 !important;
        margin: 24px auto 0 !important;
        background: #f7f8f6;
        border-radius: 44px;
        box-shadow: 0 0 0 10px #0b0b0d, 0 24px 64px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }
      /* 覆盖 uni-app 默认 height:100%，使壳内页面容器固定高度并内部滚动 */
      #app uni-app,
      #app uni-page,
      #app uni-page-wrapper {
        height: 100% !important;
      }
      #app uni-page-body {
        height: 100% !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        scrollbar-width: none;
      }
      /* 壳内隐藏所有滚动条（模拟手机端无滚动条，同时释放被占用的 15px 宽度） */
      #app *::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      /* 透明下拉刷新层不拦截点击；宽度对齐手机壳，防止撑出幻影横向滚动 */
      #app uni-page-refresh {
        pointer-events: none !important;
        width: 375px !important;
        max-width: 375px !important;
        left: 50% !important;
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
